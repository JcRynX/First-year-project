<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Work</title>



<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}


body {
font-family: 'Times New Roman', Times, serif;
background-image: url(./images/nature.jpg);
background-size: cover;
background-attachment: fixed;
color: white;
}



ul {
list-style: none;
background-color: rgba(255, 192, 203, 0.9);
overflow: hidden;
}


li {
float: right;
}


li a {
display: block;
padding: 16px 18px;
color: white;
text-decoration: none;
font-size: 18px;
}

li a:hover {
background-color: blue;
}


h2 {
padding: 14px;
}



.container {
max-width: 900px;
margin: 60px auto;
padding: 40px;
background: rgba(0, 0, 0, 0.6);
border-radius: 30px;
text-align: center;
box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
}


h1 {
margin-bottom: 30px;
font-size: 60px;
}



.work-list {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 30px;
margin-top: 30px;
}

.work-card {
padding: 40px 20px;
border-radius: 25px;
font-size: 28px;
cursor: pointer;
transition: transform 0.3s ease, box-shadow 0.3s ease;
color: black;
text-decoration: none;
font-weight: bold;
}


.work-card:hover {
transform: translateY(-10px) scale(1.05);
box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
}


.act1 { background-color: red; }
.act2 { background-color: orange; }
.act3 { background-color: yellow; }
.act4 { background-color: green; }



#message {
margin-top: 25px;
font-size: 22px;
display: none;
}


.fade {
animation: fadeIn 0.6s ease-in-out;
}



@keyframes fadeIn {
from {
opacity: 0;
transform: translateY(10px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
</style>
</head>


<body>



 <ul>
  <li><a href="main.html">Home</a></li>
  <li><a href="about me.html">About me</a></li>
  <li><a href="my information.html">Information</a></li>
  <li><a href="my photos.html">Photos</a></li>
  <li><a href="my work.html">My Work</a></li>
  <a href="./images/IG.png"></a>
  <h2>Jc Ryan Arcenas BSCS-1</h2>
</ul>
<div class="container">
<h1>MY WORK</h1>
<p>Click an activity to view my work 👇</p>


<div class="work-list">
<a href="Activity 1.html" class="work-card act1" onclick="showMsg('Activity 1')">Activity 1</a>
<a href="Activity 2.html" class="work-card act2" onclick="showMsg('Activity 2')">Activity 2</a>
<a href="Activity 3.html" class="work-card act3" onclick="showMsg('Activity 3')">Activity 3</a>
<a href="Activity 4.html" class="work-card act4" onclick="showMsg('Activity 4')">Activity 4</a>
</div>


<div id="message"></div>
</div>

<script>
function showMsg(activity) {
const msg = document.getElementById('message');
msg.innerHTML = 'Opening ' + activity + '...';
msg.style.display = 'block';
msg.classList.add('fade');
}
</script>


</body>
</html>
